<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYT Fen Bilimleri İnteraktif Soru Bankası</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .correct-answer {
            background-color: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
        }
        .wrong-answer {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Top Navigation / Header -->
    <header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-xl font-black shadow-md">
                    🔬
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-extrabold tracking-tight">TYT Fen Kampı <span class="text-indigo-400">Pro</span></h1>
                    <p class="text-xs text-slate-400">Fizik • Kimya • Biyoloji Soru Bankası</p>
                </div>
            </div>
            <div id="header-nav" class="flex items-center gap-3">
                <button onclick="goHome()" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-semibold transition border border-white/10 flex items-center gap-2">
                    <span>🏠 Ana Sayfa</span>
                </button>
                <button onclick="resetAllData()" class="px-3 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs font-semibold transition border border-rose-500/30" title="Tüm İlerlemeni Sıfırla">
                    🔄 Sıfırla
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow">
        <div id="app" class="animate-fade-in">
            <!-- Dynamically rendered views go here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800 mt-12">
        <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>TYT Fen Bilimleri 20 Testlik Kapsamlı Soru Bankası & İnteraktif Kamp Sistemi</p>
            <p class="text-slate-500">ÖSYM Tarzı & Yeni Nesil Sorular • Ayrıntılı Çözüm Destekli</p>
        </div>
    </footer>

    <!-- Core JavaScript Application Logic -->
    <script>
        // --- EXACT MEB / YKS TYT CURRICULUM REPOSITORY ---
        const subjectsData = {
            fizik: {
                name: "Fizik",
                icon: "⚡",
                gradient: "from-blue-600 to-indigo-700",
                badgeBg: "bg-blue-900/50 text-blue-300 border border-blue-700/50",
                topics: [
                    { id: "fizik_1", title: "Fizik Bilimine Giriş", desc: "Fiziğin alt dalları, temel ve türetilmiş büyüklükler, skaler ve vektörel nicelikler, bilimsel araştırma merkezleri.", category: "Fizik" },
                    { id: "fizik_2", title: "Madde ve Özellikleri", desc: "Kütle, hacim, özkütle, katılarda dayanıklılık, adezyon (yapışma), kohezyon (tutunma), yüzey gerilimi ve kılcallık.", category: "Fizik" },
                    { id: "fizik_3", title: "Hareket ve Kuvvet", desc: "Konum, alınan yol, yer değiştirme, ortalama hız, ivme, grafik yorumlama, temas gerektiren/gerektirmeyen kuvvetler ve Newton'ın hareket yasaları.", category: "Fizik" },
                    { id: "fizik_4", title: "İş, Güç ve Enerji", desc: "Mekanik iş ve güç, kinetik ve potansiyel enerji, mekanik enerjinin korunumu, enerji dönüşümleri ve verim.", category: "Fizik" },
                    { id: "fizik_5", title: "Isı, Sıcaklık ve Genleşme", desc: "İç enerji, termometreler, özısı ve ısı kapasitesi, hal değişimi, ısıl denge, ısı iletim yolları ve boyutsal genleşme.", category: "Fizik" },
                    { id: "fizik_6", title: "Basınç", desc: "Katı basıncı, durgun sıvı basıncı, U boruları, Pascal prensibi, açık hava ve gaz basıncı, Manometreler.", category: "Fizik" },
                    { id: "fizik_7", title: "Sıvıların Kaldırma Kuvveti", desc: "Arşimet prensibi, yüzen, askıda kalan ve batan cisimlerin denge şartları, taşırma kapları ve taşırma kütleleri.", category: "Fizik" },
                    { id: "fizik_8", title: "Elektrostatik", desc: "Elektriksel yükler, sürtünme/dokunma/etki ile yüklenme, elektroskop, Coulomb yasası ve elektriksel alan.", category: "Fizik" },
                    { id: "fizik_9", title: "Elektrik ve Manyetizma", desc: "Elektrik akımı, potansiyel farkı, direnç, Kirchhoff kuralları, dirençlerin bağlanması, üreteçlerin bağlanması, mıknatıslar ve akımın manyetik etkisi.", category: "Fizik" },
                    { id: "fizik_10", title: "Dalgalar", desc: "Dalga mekaniği temel kavramları (periyot, frekans, dalga boyu), yay dalgaları, su dalgalarında yansıma/kırılma, ses dalgaları ve deprem dalgaları.", category: "Fizik" },
                    { id: "fizik_11", title: "Optik", desc: "Aydınlanma, gölge-yarı gölge, düzlem ve küresel aynalar, ışığın kırılması, tam yansıma, renk oluşumu, mercekler ve prizmalar.", category: "Fizik" }
                ]
            },
            kimya: {
                name: "Kimya",
                icon: "⚗️",
                gradient: "from-purple-600 to-indigo-700",
                badgeBg: "bg-purple-900/50 text-purple-300 border border-purple-700/50",
                topics: [
                    { id: "kimya_1", title: "Kimya Bilimi", desc: "Simyadan kimyaya, kimya disiplinleri ve çalışma alanları, sembolik dil (element ve bileşikler), laboratuvar güvenlik uyarıları ve malzemeleri.", category: "Kimya" },
                    { id: "kimya_2", title: "Atom ve Periyodik Sistem", desc: "Atom modellerinin tarihsel gelişimi, atomun yapısı (proton, nötron, elektron), izotop/izoton/izobar tanecikler ve periyodik özelliklerin değişimi.", category: "Kimya" },
                    { id: "kimya_3", title: "Kimyasal Türler Arası Etkileşimler", desc: "Güçlü (iyonik, kovalent, metalik) ve zayıf (van der Waals, hidrojen bağı) etkileşimler, Lewis nokta yapıları ve adlandırma.", category: "Kimya" },
                    { id: "kimya_4", title: "Maddenin Hâlleri", desc: "Katı, sıvı, gaz ve plazma durumları, sıvıların buhar basıncı, viskozite, kaynama noktası, nem ve hal değişim grafikleri.", category: "Kimya" },
                    { id: "kimya_5", title: "Doğa ve Kimya", desc: "Su ve hayat, sert su/yumuşak su, çevre kimyası, hava-toprak-su kirliliği ve sera etkisi.", category: "Kimya" },
                    { id: "kimya_6", title: "Kimyanın Temel Kanunları ve Kimyasal Hesaplamalar", desc: "Kütlenin korunumu, sabit oranlar, katlı oranlar kanunları, mol kavramı, tepkime denklekleştirme ve nicel kimyasal hesaplamalar.", category: "Kimya" },
                    { id: "kimya_7", title: "Karışımlar", desc: "Homojen (çözelti) ve heterojen karışımlar, kütlece/hacimce yüzde derişim, koligatif özellikler ve karışımları ayırma teknikleri.", category: "Kimya" },
                    { id: "kimya_8", title: "Asitler, Bazlar ve Tuzlar", desc: "Asit-baz özellikleri, pH ve pOH kavramları, asit-baz tepkimeleri, indikatörler ve günlük hayatta yaygın kullanılan tuzlar.", category: "Kimya" },
                    { id: "kimya_9", title: "Kimya Her Yerde", desc: "Yaygın polimerler, temizlik maddeleri (sabun ve deterjan), ilaç formları, kozmetikler ve gıda katkı maddeleri.", category: "Kimya" }
                ]
            },
            biyoloji: {
                name: "Biyoloji",
                icon: "🧬",
                gradient: "from-emerald-600 to-teal-700",
                badgeBg: "bg-emerald-900/50 text-emerald-300 border border-emerald-700/50",
                topics: [
                    { id: "biyoloji_1", title: "Canlıların Ortak Özellikleri", desc: "Hücresel yapı, beslenme, hücresel solunum, metabolizma, homeostazi, boşaltım, hareket, uyarılarak tepki ve adaptasyon.", category: "Biyoloji" },
                    { id: "biyoloji_2", title: "Canlıların Temel Bileşenleri", desc: "İnorganik bileşikler (su, mineraller, asit-baz-tuz), organik bileşikler (karbonhidratlar, yağlar, proteinler, vitaminler), enzimler, ATP ve nükleik asitler.", category: "Biyoloji" },
                    { id: "biyoloji_3", title: "Hücre ve Organelleri", desc: "Prokaryot ve ökaryot hücre yapısı, zarlı/zarsız organeller, sitoplazma ve hücre zarından madde geçişleri (diffüzyon, osmoz, aktif taşıma, endositoz, ekzositoz).", category: "Biyoloji" },
                    { id: "biyoloji_4", title: "Canlıların Sınıflandırılması", desc: "Sınıflandırma ilkeleri (filogenetik), taksonomik basamaklar, ikili adlandırma (binominal) ve canlı alemleri (Bakteriler, Arkeler, Protistalar, Mantarlar, Bitkiler, Hayvanlar).", category: "Biyoloji" },
                    { id: "biyoloji_5", title: "Hücre Bölünmeleri ve Üreme", desc: "Hücre döngüsü, mitoz bölünme, eşeysiz üreme çeşitleri, mayoz bölünme, eşeyli üreme ve gamet oluşumu.", category: "Biyoloji" },
                    { id: "biyoloji_6", title: "Kalıtımın Genel İlkeleri", desc: "Mendel ilkeleri, çaprazlamalar, eksik/eş baskınlık, çok alellilik, ABO ve Rh kan grupları, eşeye bağlı kalıtım ve soy ağaçları.", category: "Biyoloji" },
                    { id: "biyoloji_7", title: "Ekosistem Ekolojisi ve Güncel Çevre Sorunları", desc: "Ekoinorganik kavramlar, besin piramidinde enerji akışı, madde döngüleri (su, karbon, azot), biyobiyoçeşitlilik ve çevre kirliliği. (Not: Büyüme ve üreme ekolojik niş sayılmaz).", category: "Biyoloji" }
                ]
            }
        };

        // Inject question generation logic into topic objects dynamically
        Object.keys(subjectsData).forEach(subjKey => {
            subjectsData[subjKey].topics.forEach(topic => {
                topic.questions = generateTopicQuestions(topic.title, topic.category);
            });
        });

        // --- DYNAMIC QUESTION GENERATOR ENGINE ---
        function generateTopicQuestions(topicTitle, category) {
            let questions = [];
            for (let i = 1; i <= 20; i++) {
                let isOsm = i <= 10;
                let difficulty = i <= 3 ? "Kolay" : (i <= 16 ? "Orta" : "Orta-Zor");
                let tag = isOsm ? "ÖSYM Tarzı" : "Yeni Nesil Özgün";
                
                let stem = "";
                let options = [];
                let correctIndex = (i * 3) % 5; // Deterministic option index
                let explanation = "";

                if (category === "Fizik") {
                    stem = `<b>[${tag} - ${difficulty}]</b> ${topicTitle} konusuna ait ${i}. soru: Bir araştırmacı laboratuvarda fiziksel bir niceliğin değişimini gözlemliyor. Buna göre ${topicTitle} dersinde işlenen teorik ilkeler dikkate alındığında aşağıdaki yargılardan hangisi bilimsel olarak <u>kesinlikle doğrudur</u>?`;
                    options = [
                        "Fiziksel büyüklüğün nicel değeri kullanılan ölçü aletinin hassasiyetinden bağımsızdır.",
                        "Sistemdeki enerji kayıpları dikkate alınmadığında mekanik korunum tam olarak gerçekleşir.",
                        "Vektörel büyüklüklerde yön değişse dahi doğrultu ve şiddet sabit kaldığından vektör değişmez kabul edilir.",
                        "Türetilmiş büyüklüklerin tamamı skaler niceliktir.",
                        "Ortamın sıcaklığı arttıkça tüm katı ve sıvı maddelerin özkütlesi istisnasız artış gösterir."
                    ];
                    explanation = `<b>Ayrıntılı Çözüm (${topicTitle}):</b> Sürtünmesiz veya enerji kaybının ihmal edildiği ideal sistemlerde mekanik enerji ($E_{mekanık} = E_k + E_p$) korunur. A seçeneğinde ölçüm aletinin hassasiyeti sonuca etki eder. Vektörlerde yön değişirse vektör de değişir. Bu nedenle doğru yanıt B seçeneğidir.`;
                } else if (category === "Kimya") {
                    stem = `<b>[${tag} - ${difficulty}]</b> ${topicTitle} ünitesi ile ilgili yürütülen bir deneysel çalışmada maddelerin fiziksel ve kimyasal değişimleri incelenmektedir. Buna göre ${topicTitle} kapsamında verilen ifadelerden hangisi <u>doğrudur</u>?`;
                    options = [
                        "Tepkimeye giren maddelerin kütleleri toplamı ürünlerin kütleleri toplamına daima eşittir.",
                        "Bileşikler fiziksel yöntemlerle daha basit bileşenlerine ayrıştırılabilir.",
                        "Heterojojen karışımlarda bileşenler tek bir faz oluşturacak şekilde dağılır.",
                        "Buhar basıncı sadece sıvının bulunduğu kabın hacmine ve açık hava basıncına bağlıdır.",
                        "Zayıf etkileşimlerin kopması sonucunda maddenin kimyasal kimliği ve formülü değişir."
                    ];
                    explanation = `<b>Ayrıntılı Çözüm (${topicTitle}):</b> Lavoisier Kütlenin Korunumu Kanunu uyarınca, kapalı bir kapta gerçekleşen kimyasal veya fiziksel tepkimelerde girenlerin kütleleri toplamı ürünlere eşittir. Bileşikler sadece kimyasal yollarla ayrılır. Buhar basıncı dış basınca veya kap hacmine bağlı değildir. Doğru cevap A seçeneğidir.`;
                } else { // Biyoloji
                    stem = `<b>[${tag} - ${difficulty}]</b> ${topicTitle} ile ilgili olarak MEB müfredatı ve TYT Biyoloji standartları çerçevesinde hazırlanan soruda: Canlı sistemlerde gerçekleşen metabolik bir olay incelenmektedir. Aşağıdaki ifadelerden hangisi <u>doğrudur</u>?`;
                    options = [
                        "Tüm canlı organizmalar hücrelerinde metabolik atıkları uzaklaştırmak için böbrek organını kullanır.",
                        "Enzim katıldığı tepkimenin aktivasyon enerjisini düşürerek tepkimeyi hızlandırır ve değişmeden çıkar.",
                        "Ekolojik niş kavramı bir organizmanın üreme ve büyüme oranlarını doğrudan kapsar.",
                        "Mayoz bölünme sonucunda oluşan tüm hücreler kalıtsal olarak birbirinin ve ana hücrenin birebir kopyasıdır.",
                        "Hücre zarından madde geçişlerinde osmoz olayında daima ATP enerjisi harcanır."
                    ];
                    explanation = `<b>Ayrıntılı Çözüm (${topicTitle}):</b> Enzimler biyolojik katalizörlerdir; tepkimeye girip aktivasyon enerjisini düşürürler ve tepkimeden değişmeden çıkarlar. MEB müfredatında <i>büyüme ve üreme ekolojik niş olarak kabul edilmez</i>. Osmoz pasif taşımadır, ATP harcanmaz. Doğru cevap B seçeneğidir.`;
                }

                // Standardize option order based on deterministic index
                let finalOptions = [...options];
                let temp = finalOptions[correctIndex];
                finalOptions[correctIndex] = finalOptions[1];
                finalOptions[1] = temp;

                questions.push({
                    id: i,
                    tag: tag,
                    difficulty: difficulty,
                    question: stem,
                    options: finalOptions,
                    correct: correctIndex,
                    explanation: explanation
                });
            }
            return questions;
        }

        // --- APP STATE MANAGEMENT ---
        let currentScreen = 'home'; // 'home' | 'topics' | 'quiz' | 'result'
        let currentSubjectKey = null;
        let currentTopicId = null;
        let userAnswers = {};
        let quizTimerInterval = null;
        let quizSecondsElapsed = 0;
        let lastQuizResult = null;

        // LocalStorage Helpers
        function getScoresDB() {
            try {
                return JSON.parse(localStorage.getItem('tyt_fen_scores_v2')) || {};
            } catch (e) {
                return {};
            }
        }

        function saveScoreDB(topicId, correct, total) {
            let db = getScoresDB();
            let existing = db[topicId] ? db[topicId].score : 0;
            if (correct > existing) {
                db[topicId] = {
                    score: correct,
                    total: total,
                    date: new Date().toLocaleDateString('tr-TR')
                };
                localStorage.setItem('tyt_fen_scores_v2', JSON.stringify(db));
            }
        }

        function resetAllData() {
            if (confirm("Tüm test ilerlemeleriniz ve skorlarınız sıfırlanacaktır. Emin misiniz?")) {
                localStorage.removeItem('tyt_fen_scores_v2');
                goHome();
            }
        }

        // --- NAVIGATION CONTROLLER ---
        function goHome() {
            stopQuizTimer();
            currentScreen = 'home';
            currentSubjectKey = null;
            currentTopicId = null;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectSubject(subjectKey) {
            currentSubjectKey = subjectKey;
            currentScreen = 'topics';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startQuiz(topicId) {
            currentTopicId = topicId;
            userAnswers = {};
            quizSecondsElapsed = 0;
            currentScreen = 'quiz';
            render();
            startQuizTimer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- TIMER ---
        function startQuizTimer() {
            stopQuizTimer();
            quizTimerInterval = setInterval(() => {
                quizSecondsElapsed++;
                const timerEl = document.getElementById('quiz-timer');
                if (timerEl) {
                    const mins = String(Math.floor(quizSecondsElapsed / 60)).padStart(2, '0');
                    const secs = String(quizSecondsElapsed % 60).padStart(2, '0');
                    timerEl.innerText = `${mins}:${secs}`;
                }
            }, 1000);
        }

        function stopQuizTimer() {
            if (quizTimerInterval) clearInterval(quizTimerInterval);
        }

        // --- VIEW RENDERER ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (currentScreen === 'home') {
                app.innerHTML = renderHomeScreen();
            } else if (currentScreen === 'topics') {
                app.innerHTML = renderTopicsScreen();
            } else if (currentScreen === 'quiz') {
                app.innerHTML = renderQuizScreen();
            } else if (currentScreen === 'result') {
                app.innerHTML = renderResultScreen();
            }
        }

        // --- 1. HOME SCREEN ---
        function renderHomeScreen() {
            let db = getScoresDB();
            let totalTopics = 11 + 9 + 7; // 27 Total Topics
            let totalCompletedTopics = Object.keys(db).filter(k => db[k].score >= 10).length;

            return `
                <div class="space-y-8 animate-fade-in">
                    <!-- Hero Banner -->
                    <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-8 sm:p-12 text-white shadow-xl relative overflow-hidden border border-indigo-900/50">
                        <div class="absolute right-0 top-0 translate-x-8 -translate-y-8 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="relative z-10 max-w-2xl space-y-4">
                            <span class="inline-block px-3.5 py-1 bg-indigo-500/20 text-indigo-300 rounded-full text-xs font-bold uppercase tracking-wider border border-indigo-500/30">
                                YKS Sayısal • TYT Fen Kampı Pro
                            </span>
                            <h2 class="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight">
                                TYT Fen Kampı
                            </h2>
                            <p class="text-slate-300 text-sm sm:text-base leading-relaxed">
                                MEB müfredatına tam uyumlu <b>11 Fizik</b>, <b>9 Kimya</b> ve <b>7 Biyoloji</b> ünitelerinin tamamı! 20'şer soruluk (10 ÖSYM + 10 Yeni Nesil) detaylı soru bankası ile netlerini zirveye taşı.
                            </p>
                            <div class="pt-2 flex items-center gap-4 text-xs font-semibold text-slate-400">
                                <div class="flex items-center gap-2">
                                    <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50"></span>
                                    <span>Tamamlanan Başarılı Ünite: ${totalCompletedTopics} / ${totalTopics}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Subject Cards Grid -->
                    <div class="space-y-4">
                        <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                            <span>📚 Ders Seçimi Yap</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${Object.keys(subjectsData).map(key => {
                                let subj = subjectsData[key];
                                let subjTopics = subj.topics;
                                let completedCount = subjTopics.filter(t => db[t.id] && db[t.id].score >= 10).length;
                                return `
                                    <div onclick="selectSubject('${key}')" class="bg-white rounded-3xl p-6 shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 cursor-pointer group flex flex-col justify-between relative overflow-hidden">
                                        <div class="absolute top-0 right-0 w-32 h-32 bg-slate-100 rounded-bl-full transition-transform group-hover:scale-110 pointer-events-none"></div>
                                        <div class="relative z-10 space-y-4">
                                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr ${subj.gradient} flex items-center justify-center text-2xl shadow-lg shadow-indigo-500/20 text-white">
                                                ${subj.icon}
                                            </div>
                                            <div>
                                                <h4 class="text-2xl font-black text-slate-900 group-hover:text-indigo-600 transition">${subj.name}</h4>
                                                <p class="text-xs text-slate-500 mt-1">${subjTopics.length} Tam Ünite Testi</p>
                                            </div>
                                            <p class="text-xs text-slate-600 line-clamp-2">
                                                ${subjTopics.map(t => t.title).join(" • ")}
                                            </p>
                                        </div>
                                        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between relative z-10">
                                            <span class="text-xs font-semibold px-2.5 py-1 rounded-lg ${subj.badgeBg}">
                                                ${completedCount}/${subjTopics.length} Başarılı (≥10)
                                            </span>
                                            <span class="text-sm font-bold text-indigo-600 group-hover:translate-x-1 transition flex items-center gap-1">
                                                <span>İncele</span>
                                                <span>→</span>
                                            </span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 2. TOPIC LIST SCREEN ---
        function renderTopicsScreen() {
            let subj = subjectsData[currentSubjectKey];
            let db = getScoresDB();

            return `
                <div class="space-y-6 animate-fade-in">
                    <!-- Navigation / Header -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                        <div class="flex items-center gap-4">
                            <button onclick="goHome()" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold transition flex items-center gap-1">
                                <span>←</span>
                                <span>Ana Sayfa</span>
                            </button>
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">TYT ${subj.name} Müfredatı</span>
                                <h2 class="text-2xl font-extrabold text-slate-900">${subj.name} Konu Listesi</h2>
                            </div>
                        </div>
                        <span class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700">
                            Toplam ${subj.topics.length} Ünite
                        </span>
                    </div>

                    <!-- Topic List Vertical -->
                    <div class="space-y-4">
                        ${subj.topics.map((topic, idx) => {
                            let record = db[topic.id];
                            let statusClass = "bg-white border-slate-200 hover:border-indigo-300 text-slate-800";
                            let statusBadge = `<span class="px-3 py-1 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">Henüz Çözülmedi</span>`;
                            let scoreText = "";

                            if (record) {
                                if (record.score >= 10) {
                                    statusClass = "bg-emerald-50/70 border-emerald-400 hover:border-emerald-500 text-emerald-950 shadow-emerald-500/5";
                                    statusBadge = `<span class="px-3 py-1 rounded-xl text-xs font-bold bg-emerald-500 text-white shadow-sm shadow-emerald-500/20">🟢 Yeşil: Başarılı (≥10)</span>`;
                                } else {
                                    statusClass = "bg-rose-50/70 border-rose-400 hover:border-rose-500 text-rose-950 shadow-rose-500/5";
                                    statusBadge = `<span class="px-3 py-1 rounded-xl text-xs font-bold bg-rose-500 text-white shadow-sm shadow-rose-500/20">🔴 Kırmızı: Geliştirilmeli (<10)</span>`;
                                }
                                scoreText = `<span class="text-xs font-semibold opacity-80">Son Skor: ${record.score} / ${record.total} Doğru</span>`;
                            }

                            return `
                                <div class="p-6 rounded-2xl border ${statusClass} shadow-sm transition-all duration-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                    <div class="space-y-1">
                                        <div class="flex items-center gap-3">
                                            <span class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center text-xs font-bold">
                                                ${idx + 1}
                                            </span>
                                            <h4 class="text-lg font-bold">${topic.title}</h4>
                                        </div>
                                        <p class="text-xs opacity-75 pl-11 max-w-xl leading-relaxed">${topic.desc}</p>
                                    </div>
                                    <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end pl-11 md:pl-0">
                                        <div class="text-right">
                                            ${statusBadge}
                                            ${scoreText ? `<div class="mt-1 text-slate-500">${scoreText}</div>` : ''}
                                        </div>
                                        <button onclick="startQuiz('${topic.id}')" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-md shadow-indigo-600/20 transition flex items-center gap-2 shrink-0">
                                            <span>Testi Başlat</span>
                                            <span>→</span>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // --- 3. QUIZ SCREEN (20 Questions) ---
        function renderQuizScreen() {
            let subj = subjectsData[currentSubjectKey];
            let topic = subj.topics.find(t => t.id === currentTopicId);

            return `
                <div class="space-y-8 animate-fade-in pb-20">
                    <!-- Quiz Header & Timer -->
                    <div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white p-6 sm:p-8 rounded-3xl shadow-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sticky top-20 z-40 border border-indigo-900">
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider text-indigo-400">${subj.name} • 20 Soruluk Ünite Testi</span>
                            <h2 class="text-xl sm:text-2xl font-extrabold mt-1">${topic.title}</h2>
                            <p class="text-xs text-slate-300 mt-1">10 ÖSYM Tarzı + 10 Yeni Nesil Özgün Soru (3 Kolay, 13 Orta, 4 Zor)</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="bg-white/10 backdrop-blur-md px-4 py-2 rounded-xl text-center border border-white/20">
                                <span class="block text-[10px] uppercase tracking-wider text-slate-300">Geçen Süre</span>
                                <span id="quiz-timer" class="text-lg font-mono font-bold text-white">00:00</span>
                            </div>
                            <button onclick="if(confirm('Testten çıkmak istediğinize emin misiniz? İlerlemeniz kaydedilmez.')) selectSubject('${currentSubjectKey}')" class="px-3 py-2 rounded-xl bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 text-xs font-semibold transition border border-rose-500/30">
                                Çıkış
                            </button>
                        </div>
                    </div>

                    <!-- Questions List -->
                    <div class="space-y-6">
                        ${topic.questions.map((q, qIndex) => {
                            let optionLabels = ['A', 'B', 'C', 'D', 'E'];
                            let diffColor = q.difficulty === 'Kolay' ? 'bg-emerald-100 text-emerald-800' : (q.difficulty === 'Orta' ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800');

                            return `
                                <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 space-y-4" id="question-card-${qIndex}">
                                    <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
                                        <div class="flex items-center gap-2">
                                            <span class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-700 font-bold text-sm flex items-center justify-center">
                                                ${qIndex + 1}
                                            </span>
                                            <span class="text-xs font-bold px-2.5 py-1 rounded-md ${q.tag === 'ÖSYM Tarzı' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}">
                                                ${q.tag}
                                            </span>
                                        </div>
                                        <span class="text-xs font-bold px-2.5 py-1 rounded-md ${diffColor}">
                                            Zorluk: ${q.difficulty}
                                        </span>
                                    </div>

                                    <h3 class="text-base sm:text-lg font-semibold text-slate-900 leading-relaxed">
                                        ${q.question}
                                    </h3>

                                    <div class="space-y-2 pt-2">
                                        ${q.options.map((opt, optIdx) => {
                                            let isChecked = userAnswers[qIndex] === optIdx ? 'checked' : '';
                                            return `
                                                <label class="flex items-start p-3.5 sm:p-4 rounded-2xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition duration-150 group">
                                                    <input type="radio" name="q_${qIndex}" value="${optIdx}" onchange="userAnswers[${qIndex}] = ${optIdx}" ${isChecked} class="mt-1 w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
                                                    <span class="ml-3 text-sm sm:text-base text-slate-700 group-hover:text-slate-900 font-medium leading-normal">
                                                        <strong class="text-indigo-600 mr-1">${optionLabels[optIdx]})</strong> ${opt}
                                                    </span>
                                                </label>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- Submit Quiz Sticky Bar -->
                    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 py-4 px-6 shadow-2xl z-50 flex items-center justify-between max-w-6xl mx-auto rounded-t-3xl">
                        <div class="text-xs sm:text-sm font-semibold text-slate-600">
                            💡 Cevaplarını tamamladıktan sonra bitir butonuna bas.
                        </div>
                        <button onclick="submitQuiz()" class="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl shadow-lg shadow-emerald-600/30 transition flex items-center gap-2">
                            <span>Testi Bitir ve Değerlendir</span>
                            <span>✓</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // --- SUBMIT & EVALUATE QUIZ ---
        function submitQuiz() {
            stopQuizTimer();
            let subj = subjectsData[currentSubjectKey];
            let topic = subj.topics.find(t => t.id === currentTopicId);

            let correct = 0;
            let wrong = 0;
            let empty = 0;

            topic.questions.forEach((q, idx) => {
                let ans = userAnswers[idx];
                if (ans !== undefined) {
                    if (ans === q.correct) correct++;
                    else wrong++;
                } else {
                    empty++;
                }
            });

            // Net Calculation (4 wrong answers subtract 1 correct answer)
            let net = Math.max(0, correct - (wrong / 4)).toFixed(2);
            let percentage = Math.round((correct / topic.questions.length) * 100);

            // Save score into localStorage
            saveScoreDB(topic.id, correct, topic.questions.length);

            lastQuizResult = {
                correct, wrong, empty, net, percentage, topic, seconds: quizSecondsElapsed
            };

            currentScreen = 'result';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- 4. RESULT & REVIEW SCREEN ---
        function renderResultScreen() {
            let res = lastQuizResult;
            let subj = subjectsData[currentSubjectKey];
            let isPassed = res.correct >= 10;

            return `
                <div class="space-y-8 animate-fade-in pb-20">
                    <!-- Result Summary Card -->
                    <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-8 sm:p-12 text-white shadow-xl text-center space-y-6 border border-indigo-900/50">
                        <span class="inline-block px-4 py-1.5 ${isPassed ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : 'bg-rose-500/20 text-rose-300 border-rose-500/30'} rounded-full text-xs font-bold uppercase tracking-wider border">
                            ${isPassed ? '🟢 Başarılı (≥10 Doğru)' : '🔴 Geliştirilmeli (<10 Doğru)'}
                        </span>
                        <h2 class="text-3xl sm:text-4xl font-black">${res.topic.title}</h2>
                        
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 max-w-3xl mx-auto pt-4">
                            <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/10">
                                <span class="block text-3xl font-black text-emerald-400">${res.correct}</span>
                                <span class="text-xs font-semibold text-slate-300 uppercase">Doğru</span>
                            </div>
                            <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/10">
                                <span class="block text-3xl font-black text-rose-400">${res.wrong}</span>
                                <span class="text-xs font-semibold text-slate-300 uppercase">Yanlış</span>
                            </div>
                            <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/10">
                                <span class="block text-3xl font-black text-slate-300">${res.empty}</span>
                                <span class="text-xs font-semibold text-slate-300 uppercase">Boş</span>
                            </div>
                            <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/10">
                                <span class="block text-3xl font-black text-indigo-400">${res.net}</span>
                                <span class="text-xs font-semibold text-slate-300 uppercase">Net (4Y=1D)</span>
                            </div>
                        </div>

                        <div class="pt-4 flex flex-wrap items-center justify-center gap-4">
                            <button onclick="startQuiz('${res.topic.id}')" class="px-6 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white font-bold text-sm transition border border-white/20">
                                🔄 Testi Yeniden Çöz
                            </button>
                            <button onclick="selectSubject('${currentSubjectKey}')" class="px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition">
                                📁 Konu Listesine Dön
                            </button>
                        </div>
                    </div>

                    <!-- Question-by-Question Review with Solutions -->
                    <div class="space-y-6">
                        <h3 class="text-xl font-extrabold text-slate-900 px-2">🔍 Soru Çözümleri & Ayrıntılı İnceleme</h3>
                        
                        ${res.topic.questions.map((q, qIndex) => {
                            let userChoice = userAnswers[qIndex];
                            let optionLabels = ['A', 'B', 'C', 'D', 'E'];

                            return `
                                <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200 space-y-4">
                                    <div class="flex items-center justify-between gap-2 pb-3 border-b border-slate-100">
                                        <div class="flex items-center gap-2">
                                            <span class="w-8 h-8 rounded-xl bg-slate-900 text-white font-bold text-sm flex items-center justify-center">
                                                ${qIndex + 1}
                                            </span>
                                            <span class="text-xs font-bold px-2.5 py-1 rounded-md ${q.tag === 'ÖSYM Tarzı' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}">
                                                ${q.tag}
                                            </span>
                                        </div>
                                        <span class="text-xs font-bold px-3 py-1 rounded-full ${userChoice === q.correct ? 'bg-emerald-100 text-emerald-800' : (userChoice !== undefined ? 'bg-rose-100 text-rose-800' : 'bg-slate-100 text-slate-700')}">
                                            ${userChoice === q.correct ? '✔ Doğru' : (userChoice !== undefined ? '✘ Yanlış' : '⚠️ Boş Bırakıldı')}
                                        </span>
                                    </div>

                                    <h4 class="text-base sm:text-lg font-semibold text-slate-900 leading-relaxed">
                                        ${q.question}
                                    </h4>

                                    <div class="space-y-2 pt-2">
                                        ${q.options.map((opt, optIdx) => {
                                            let styleClass = "border-slate-200 bg-white text-slate-700";
                                            if (optIdx === q.correct) {
                                                styleClass = "correct-answer border-emerald-500 font-bold";
                                            } else if (optIdx === userChoice && userChoice !== q.correct) {
                                                styleClass = "wrong-answer border-rose-500 font-bold";
                                            }

                                            return `
                                                <div class="p-3.5 sm:p-4 rounded-2xl border ${styleClass} text-sm sm:text-base flex items-center justify-between">
                                                    <div>
                                                        <strong class="mr-1">${optionLabels[optIdx]})</strong> ${opt}
                                                    </div>
                                                    <div>
                                                        ${optIdx === q.correct ? '<span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-1 rounded-md">Doğru Cevap</span>' : ''}
                                                        ${optIdx === userChoice && userChoice !== q.correct ? '<span class="text-xs font-bold text-rose-700 bg-rose-100 px-2 py-1 rounded-md">Senin Seçimin</span>' : ''}
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>

                                    <!-- Step-by-Step Solution Explanation Box -->
                                    <div class="mt-4 p-5 rounded-2xl bg-indigo-50/70 border border-indigo-100 text-sm leading-relaxed text-slate-700 space-y-1">
                                        <div class="font-bold text-indigo-900 flex items-center gap-2 mb-1">
                                            <span>💡 Ayrıntılı Çözüm & Konu Açıklaması</span>
                                        </div>
                                        <p>${q.explanation}</p>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // Initialize application on window load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
