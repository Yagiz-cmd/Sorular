            </div>

        // Render Questions
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const qCard = document.createElement('div');
                qCard.className = "bg-white rounded-2xl p-6 shadow-sm border border-slate-200 transition-all duration-200";
                qCard.id = `q-card-${index}`;

                let optionsHTML = '';
                const optionLabels = ['A', 'B', 'C', 'D', 'E'];

                q.options.forEach((opt, optIndex) => {
                    optionsHTML += `
                        <label id="opt-label-${index}-${optIndex}" class="flex items-start p-3 sm:p-4 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition duration-150 group">
                            <input type="radio" name="question-${index}" value="${optIndex}" class="mt-1 w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-slate-300">
                            <span class="ml-3 text-sm sm:text-base text-slate-700 group-hover:text-slate-900 font-medium">
                                <strong class="text-slate-400 mr-1">${optionLabels[optIndex]})</strong> ${opt}
                            </span>
                        </label>
                    `;
                });

                qCard.innerHTML = `
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-bold px-2.5 py-1 rounded-md ${q.tag === 'ÖSYM Tarzı' ? 'bg-amber-100 text-amber-800' : 'bg-purple-100 text-purple-800'}">
                            ${q.tag}
                        </span>
                        <span class="text-xs font-semibold text-slate-400">Soru ${index + 1} / 20</span>
                    </div>
                    <h3 class="text-base sm:text-lg font-semibold text-slate-900 mb-4 leading-relaxed">
                        ${q.question}
                    </h3>
                    <div class="space-y-2">
                        ${optionsHTML}
                    </div>
                    <!-- Detailed Explanation Box (Hidden by default) -->
                    <div id="explanation-${index}" class="hidden mt-4 p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm leading-relaxed">
                        <div class="font-bold text-slate-900 mb-1 flex items-center gap-2">
                            <span>💡 Soru Çözümü & Açıklama</span>
                        </div>
                        <p class="text-slate-600">${q.explanation}</p>
                    </div>
                `;
                container.appendChild(qCard);
            });

            startTimer();
        }

        // Timer Functions
        function startTimer() {
            clearInterval(timerInterval);
            timerSeconds = 0;
            timerInterval = setInterval(() => {
                timerSeconds++;
                const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                const secs = String(timerSeconds % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        // Submit and Grade Quiz
        function submitQuiz() {
            stopTimer();

            let correctCount = 0;
            let wrongCount = 0;
            let emptyCount = 0;

            questions.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="question-${index}"]:checked`);
                const qCard = document.getElementById(`q-card-${index}`);
                const explanationBox = document.getElementById(`explanation-${index}`);

                // Disable all radio inputs
                const allRadios = document.querySelectorAll(`input[name="question-${index}"]`);
                allRadios.forEach(radio => radio.disabled = true);

                // Reveal explanation
                explanationBox.classList.remove('hidden');

                // Highlight Correct Option always
                const correctLabel = document.getElementById(`opt-label-${index}-${q.correct}`);
                correctLabel.classList.add('correct-answer');

                if (selectedOption) {
                    const userChoice = parseInt(selectedOption.value);
                    if (userChoice === q.correct) {
                        correctCount++;
                    } else {
                        wrongCount++;
                        // Highlight Incorrect Choice in Red
                        const wrongLabel = document.getElementById(`opt-label-${index}-${userChoice}`);
                        wrongLabel.classList.add('wrong-answer');
                    }
                } else {
                    emptyCount++;
                    qCard.classList.add('border-amber-300', 'bg-amber-50/20');
                }
            });

            // Calculate Net Score (4 Wrongs cancel 1 Correct)
            const net = Math.max(0, (correctCount - (wrongCount / 4))).toFixed(2);
            const percentage = Math.round((correctCount / questions.length) * 100);

            // Display Score Summary
            document.getElementById('correct-count').innerText = correctCount;
            document.getElementById('wrong-count').innerText = wrongCount;
            document.getElementById('empty-count').innerText = emptyCount;
            document.getElementById('net-score').innerText = net;
            document.getElementById('score-percentage').innerText = `%${percentage} Başarı`;

            document.getElementById('score-summary').classList.remove('hidden');

            // Scroll to summary
            document.getElementById('score-summary').scrollIntoView({ behavior: 'smooth' });

            // Toggle Buttons
            document.getElementById('finish-btn').classList.add('hidden');
            document.getElementById('reset-btn').classList.remove('hidden');
        }

        // Reset Quiz
        function resetQuiz() {
            document.getElementById('score-summary').classList.add('hidden');
            document.getElementById('finish-btn').classList.remove('hidden');
            document.getElementById('reset-btn').classList.add('hidden');
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize on load
        window.onload = renderQuestions;
    </script>
</body>
</html>
