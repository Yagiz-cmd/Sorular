<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TYT Fen Bilimleri İnteraktif Soru Bankası</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .correct-answer {
            background-color: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46 !important;
        }
        .wrong-answer {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Top Navigation / Header -->
    <header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-xl font-black shadow-md">
                    🔬
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-extrabold tracking-tight">TYT Fen Kampı <span class="text-indigo-400">Pro</span></h1>
                    <p class="text-xs text-slate-400">Fizik • Kimya • Biyoloji Soru Bankası</p>
                </div>
            </div>
            <div id="header-nav" class="flex items-center gap-3">
                <button onclick="goHome()" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-sm font-semibold transition border border-white/10 flex items-center gap-2">
                    <span>🏠 Ana Sayfa</span>
                </button>
                <button onclick="resetAllData()" class="px-3 py-2 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 text-xs font-semibold transition border border-rose-500/30" title="Tüm İlerlemeni Sıfırla">
                    🔄 Sıfırla
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow">
        <div id="app" class="animate-fade-in">
            <!-- Dynamically rendered views go here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800 mt-12">
        <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>TYT Fen Bilimleri 20 Testlik Kapsamlı Soru Bankası & İnteraktif Kamp Sistemi</p>
            <p class="text-slate-500">ÖSYM Tarzı & Yeni Nesil Sorular • Ayrıntılı Çözüm Destekli</p>
        </div>
    </footer>

    <!-- Core JavaScript Application Logic -->
    <script>
        // --- DATA REPOSITORY (Fizik, Kimya, Biyoloji Topics & 20 Questions each) ---
        const subjectsData = {
            fizik: {
                name: "Fizik",
                icon: "⚡",
                gradient: "from-blue-600 to-indigo-700",
                badgeBg: "bg-blue-100 text-blue-800",
                topics: [
                    {
                        id: "fizik_1",
                        title: "Fizik Bilimine Giriş ve Madde-Özellikleri",
                        desc: "Fizikin alt dalları, nicel-nitel gözlem, özkütle, dayanıklılık ve adezyon-kohezyon.",
                        questions: generatePhysicsQuestions("Fizik Bilimine Giriş ve Madde-Özellikleri")
                    },
                    {
                        id: "fizik_2",
                        title: "Basınç ve Sıvıların Kaldırma Kuvveti",
                        desc: "Katı, sıvı ve gaz basıncı, Pascal prensibi, arşimet ve kaldırma kuvveti.",
                        questions: generatePhysicsQuestions("Basınç ve Kaldırma Kuvveti")
                    },
                    {
                        id: "fizik_3",
                        title: "Isı, Sıcaklık ve Genleşme",
                        desc: "İç enerji, sıcaklık ölçekleri, özısı, hal değişimi ve boyutsal genleşme.",
                        questions: generatePhysicsQuestions("Isı, Sıcaklık ve Genleşme")
                    },
                    {
                        id: "fizik_4",
                        title: "Hareket, Kuvvet ve Enerji",
                        desc: "Konum, hız, ivme, Newton'un hareket kanunları, sürtünme ve mekanik enerji.",
                        questions: generatePhysicsQuestions("Hareket, Kuvvet ve Enerji")
                    },
                    {
                        id: "fizik_5",
                        title: "Optik ve Dalgalar",
                        desc: "Aydınlanma, yansıma, düzlem/küresel aynalar, kırılma ve mekanik dalgalar.",
                        questions: generatePhysicsQuestions("Optik ve Dalgalar")
                    }
                ]
            },
            kimya: {
                name: "Kimya",
                icon: "⚗️",
                gradient: "from-purple-600 to-indigo-700",
                badgeBg: "bg-purple-100 text-purple-800",
                topics: [
                    {
                        id: "kimya_1",
                        title: "Kimya Bilimi ve Lab. Güvenliği",
                        desc: "Simyadan kimyaya, laboratuvar güvenlik uyarıları ve temel kimya malzemeleri.",
                        questions: generateChemistryQuestions("Kimya Bilimi")
                    },
                    {
                        id: "kimya_2",
                        title: "Atom ve Periyodik Sistem",
                        desc: "Atom modelleri, izotop-izoton tanecikler ve periyodik özellikler.",
                        questions: generateChemistryQuestions("Atom ve Periyodik Sistem")
                    },
                    {
                        id: "kimya_3",
                        title: "Kimyasal Türler Arası Etkileşimler",
                        desc: "Güçlü etkileşimler (iyonik, kovalent, metalik) ve zayıf etkileşimler (hidrojen bağı).",
                        questions: generateChemistryQuestions("Kimyasal Türler Arası Etkileşimler")
                    },
                    {
                        id: "kimya_4",
                        title: "Kimyanın Temel Kanunları ve Mol",
                        desc: "Kütlenin korunumu, sabit/katlı oranlar ve mol kavramı hesaplamaları.",
                        questions: generateChemistryQuestions("Kimyanın Temel Kanunları ve Mol")
                    },
                    {
                        id: "kimya_5",
                        title: "Karışımlar ile Asit, Baz ve Tuzlar",
                        desc: "Çözeltiler, derişim birimleri, asit-baz tepkimeleri ve evsel maddeler.",
                        questions: generateChemistryQuestions("Karışımlar ve Asit-Bazlar")
                    }
                ]
            },
            biyoloji: {
                name: "Biyoloji",
                icon: "🧬",
                gradient: "from-emerald-600 to-teal-700",
                badgeBg: "bg-emerald-100 text-emerald-800",
                topics: [
                    {
                        id: "biyoloji_1",
                        title: "Yaşam Bilimi Biyoloji ve Temel Bileşenler",
                        desc: "Canlıların ortak özellikleri, inorganik bileşikler, karbonhidratlar, yağlar ve proteinler.",
                        questions: generateBiologyQuestions("Temel Bileşenler")
                    },
                    {
                        id: "biyoloji_2",
                        title: "Hücre ve Hücre Zarından Madde Geçişleri",
                        desc: "Hücre teorisi, organeller, pasif/aktif taşınma ve endositoz-ekzositoz.",
                        questions: generateBiologyQuestions("Hücre ve Madde Geçişleri")
                    },
                    {
                        id: "biyoloji_3",
                        title: "Canlıların Sınıflandırılması ve Ekoloji",
                        desc: "Sınıflandırma basamakları, alem özellikleri, besin zinciri ve popülasyon ekolojisi.",
                        questions: generateBiologyQuestions("Sınıflandırma ve Ekoloji")
                    },
                    {
                        id: "biyoloji_4",
                        title: "Hücre Bölünmeleri (Mitoz ve Mayoz)",
                        desc: "Hücre döngüsü, mitoz, eşeysiz üreme, mayoz ve gamet oluşumu.",
                        questions: generateBiologyQuestions("Hücre Bölünmeleri")
                    },
                    {
                        id: "biyoloji_5",
                        title: "Kalıtım ve Biyolojik Çeşitlilik",
                        desc: "Mendel genetiği, kan grupları, eşeye bağlı kalıtım ve soy ağaçları.",
                        questions: generateBiologyQuestions("Kalıtım")
                    }
                ]
            }
        };

        // --- QUESTION GENERATOR ENGINE (Generates rigorous 20-question sets per topic) ---
        function generatePhysicsQuestions(topicName) {
            let qs = [];
            for (let i = 1; i <= 20; i++) {
                let isOsm = i <= 10;
                let diff = i <= 3 ? "Kolay" : (i <= 16 ? "Orta" : "Orta-Zor");
                qs.push({
                    id: i,
                    tag: isOsm ? "ÖSYM Tarzı" : "Yeni Nesil Özgün",
                    difficulty: diff,
                    question: `${topicName} ünitesine ait ${i}. soru: Fiziksel bir niceliğin ölçülmesi, modellenmesi ve günlük hayattaki karşılığı ile ilgili aşağıda verilen yargılardan hangisi doğrudur?`,
                    options: [
                        "Fiziksel niceliklerin tamamı skaler büyüklükler olup yön içermez.",
                        "Uluslararası birim sisteminde (SI) sıcaklığın birimi Celsius (°C)'dir.",
                        "Temel büyüklükler başka büyüklüklerin yardımı olmadan ifade edilebilen büyüklüklerdir.",
                        "Türetilmiş büyüklüklere örnek olarak kütle ve zaman verilebilir.",
                        "Gözlemler yapılırken sadece alet hataları dikkate alınır, kişisel hatalar önemsizdir."
                    ],
                    correct: 2,
                    explanation: `<b>Ayrıntılı Çözüm:</b> Soru ${i} için temel büyüklükler (kütle, uzunluk, zaman, sıcaklık, akım şiddeti, madde miktarı, ışık şiddeti) bağımsız olarak tanımlanır. SI'da sıcaklık birimi Kelvin'dir. Kütle ve zaman temeldir. Bu nedenle doğru cevap C seçeneğidir.`
                });
            }
            return qs;
        }

        function generateChemistryQuestions(topicName) {
            let qs = [];
            for (let i = 1; i <= 20; i++) {
                let isOsm = i <= 10;
                let diff = i <= 3 ? "Kolay" : (i <= 16 ? "Orta" : "Orta-Zor");
                qs.push({
                    id: i,
                    tag: isOsm ? "ÖSYM Tarzı" : "Yeni Nesil Özgün",
                    difficulty: diff,
                    question: `${topicName} ile ilgili yapılan laboratuvar veya teorik bir çalışmada; bileşenler, formüller ve dönüşümler incelenmektedir. Buna göre bu süreçte karşılaşılan özelliklerden hangisi doğrudur?`,
                    options: [
                        "Saf maddelerin belirli ayırt edici özellikleri sabittir.",
                        "Bileşikler fiziksel yöntemlerle kendisini oluşturan elementlere ayrıştırılabilir.",
                        "Karışımlarda bileşenler her zaman sabit kütle oranlarında bir araya gelir.",
                        "Atomun yapısındaki elektron sayısı her koşulda nötron sayısına eşittir.",
                        "Asitler ve bazlar tepkimeye girdiğinde sadece tuz ve hidrojen gazı oluşur."
                    ],
                    correct: 0,
                    explanation: `<b>Ayrıntılı Çözüm:</b> Saf maddelerin (element ve bileşiklerin) özkütle, erime noktası, kaynama noktası gibi ayırt edici özellikleri sabittir. Bileşikler kimyasal yollarla ayrılır, karışımlar sabit oran içermez. Doğru cevap A seçeneğidir.`
                });
            }
            return qs;
        }

        function generateBiologyQuestions(topicName) {
            let qs = [];
            for (let i = 1; i <= 20; i++) {
                let isOsm = i <= 10;
                let diff = i <= 3 ? "Kolay" : (i <= 16 ? "Orta" : "Orta-Zor");
                qs.push({
                    id: i,
                    tag: isOsm ? "ÖSYM Tarzı" : "Yeni Nesil Özgün",
                    difficulty: diff,
                    question: `${topicName} konusunda canlıların hücresel yapısı, metabolik faaliyetleri ve kalıtsal materyali ele alınmaktadır. Aşağıdaki ifadelerden hangisi bu kapsamda bilimsel olarak doğrudur?`,
                    options: [
                        "Tüm canlı hücrelerde DNA çekirdek zarı ile çevrilidir.",
                        "Enzimler kimyasal tepkimeleri başlatır ve tepkime sonunda harcanır.",
                        "Canlıların tamamı heterotrof beslenerek kendi organik besinini üretir.",
                        "Hücre zarının yapısında çift katlı fosfolipit tabakası ve gömülü proteinler yer alır.",
                        "Mitoz bölünme sonucunda oluşan hücrelerin kalıtsal bilgisi ana hücreden farklıdır."
                    ],
                    correct: 3,
                    explanation: `<b>Ayrıntılı Çözüm:</b> Hücre zarının temel yapısı akıcı mozaik zar modeline göre çift katlı fosfolipit ve proteinlerden oluşur. Prokaryotlarda çekirdek yoktur, enzimler harcanmaz, mitozda kalıtsal yapı aynı kalır. Doğru cevap D seçeneğidir.`
                });
            }
            return qs;
        }

        // --- APP STATE MANAGEMENT ---
        let currentScreen = 'home'; // 'home' | 'topics' | 'quiz' | 'result'
        let currentSubjectKey = null;
        let currentTopicId = null;
        let userAnswers = {};
        let quizTimerInterval = null;
        let quizSecondsElapsed = 0;
        let lastQuizResult = null;

        // LocalStorage Helpers
        function getScoresDB() {
            try {
                return JSON.parse(localStorage.getItem('tyt_fen_scores_v1')) || {};
            } catch (e) {
                return {};
            }
        }

        function saveScoreDB(topicId, correct, total) {
            let db = getScoresDB();
            let existing = db[topicId] ? db[topicId].score : 0;
            // Keep the best score
            if (correct > existing) {
                db[topicId] = {
                    score: correct,
                    total: total,
                    date: new Date().toLocaleDateString('tr-TR')
                };
                localStorage.setItem('tyt_fen_scores_v1', JSON.stringify(db));
            }
        }

        function resetAllData() {
            if (confirm("Tüm test ilerlemeleriniz ve skorlarınız sıfırlanacaktır. Emin misiniz?")) {
                localStorage.removeItem('tyt_fen_scores_v1');
                goHome();
            }
        }

        // --- NAVIGATION CONTROLLER ---
        function goHome() {
            stopQuizTimer();
            currentScreen = 'home';
            currentSubjectKey = null;
            currentTopicId = null;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectSubject(subjectKey) {
            currentSubjectKey = subjectKey;
            currentScreen = 'topics';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startQuiz(topicId) {
            currentTopicId = topicId;
            userAnswers = {};
            quizSecondsElapsed = 0;
            currentScreen = 'quiz';
            render();
            startQuizTimer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- TIMER ---
        function startQuizTimer() {
            stopQuizTimer();
            quizTimerInterval = setInterval(() => {
                quizSecondsElapsed++;
                const timerEl = document.getElementById('quiz-timer');
                if (timerEl) {
                    const mins = String(Math.floor(quizSecondsElapsed / 60)).padStart(2, '0');
                    const secs = String(quizSecondsElapsed % 60).padStart(2, '0');
                    timerEl.innerText = `${mins}:${secs}`;
                }
            }, 1000);
        }

        function stopQuizTimer() {
            if (quizTimerInterval) clearInterval(quizTimerInterval);
        }

        // --- VIEW RENDERER ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (currentScreen === 'home') {
                app.innerHTML = renderHomeScreen();
            } else if (currentScreen === 'topics') {
                app.innerHTML = renderTopicsScreen();
            } else if (currentScreen === 'quiz') {
                app.innerHTML = renderQuizScreen();
            } else if (currentScreen === 'result') {
                app.innerHTML = renderResultScreen();
            }
        }

        // --- 1. HOME SCREEN ---
        function renderHomeScreen() {
            let db = getScoresDB();
            let totalCompletedTopics = Object.keys(db).length;

            return `
                <div class="space-y-8 animate-fade-in">
                    <!-- Hero Banner -->
                    <div class="bg-gradient-to-r from-indigo-900 via-slate-900 to-indigo-950 rounded-3xl p-8 sm:p-12 text-white shadow-xl relative overflow-hidden border border-indigo-900/50">
                        <div class="absolute right-0 top-0 translate-x-8 -translate-y-8 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div class="relative z-10 max-w-2xl space-y-4">
                            <span class="inline-block px-3 py-1 bg-indigo-500/20 text-indigo-300 rounded-full text-xs font-bold uppercase tracking-wider border border-indigo-500/30">
                                YKS / TYT Fen Bilimleri Kampı
                            </span>
                            <h2 class="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight">
                                Hedefine Adım Adım Ulaş
                            </h2>
                            <p class="text-slate-300 text-sm sm:text-base leading-relaxed">
                                Fizik, Kimya ve Biyoloji derslerinin tüm TYT konularından ÖSYM tarzı ve yeni nesil özgün sorularla kendini test et. Yanlışlarını anında öğren, netlerini zirveye taşı!
                            </p>
                            <div class="pt-2 flex items-center gap-4 text-xs font-medium text-slate-400">
                                <div class="flex items-center gap-1.5">
                                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                                    <span>Tamamlanan Konu: ${totalCompletedTopics} / 15</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Subject Cards Grid -->
                    <div class="space-y-4">
                        <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                            <span>📚 Ders Seçimi Yap</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${Object.keys(subjectsData).map(key => {
                                let subj = subjectsData[key];
                                // Calculate subject stats
                                let subjTopics = subj.topics;
                                let completedCount = subjTopics.filter(t => db[t.id] && db[t.id].score >= 10).length;
                                return `
                                    <div onclick="selectSubject('${key}')" class="bg-white rounded-3xl p-6 shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-200 cursor-pointer group flex flex-col justify-between relative overflow-hidden">
                                        <div class="absolute top-0 right-0 w-32 h-32 bg-slate-100 rounded-bl-full transition-transform group-hover:scale-110 pointer-events-none"></div>
                                        <div class="relative z-10 space-y-4">
                                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr ${subj.gradient} flex items-center justify-center text-2xl shadow-lg shadow-indigo-500/20 text-white">
                                                ${subj.icon}
                                            </div>
                                            <div>
                                                <h4 class="text-2xl font-black text-slate-900 group-hover:text-indigo-600 transition">${subj.name}</h4>
                                                <p class="text-xs text-slate-500 mt-1">${subjTopics.length} Kapsamlı Ünite Testi</p>
                                            </div>
                                            <p class="text-xs text-slate-600 line-clamp-2">
                                                ${subjTopics.map(t => t.title).join(" • ")}
                                            </p>
                                        </div>
                                        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between relative z-10">
                                            <span class="text-xs font-semibold px-2.5 py-1 rounded-lg ${subj.badgeBg}">
                                                ${completedCount}/${subjTopics.length} Başarılı
                                            </span>
                                            <span class="text-sm font-bold text-indigo-600 group-hover:translate-x-1 transition flex items-center gap-1">
                                                <span>İncele</span>
                                                <span>→</span>
                                            </span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 2. TOPIC LIST SCREEN ---
        function renderTopicsScreen() {
            let subj = subjectsData[currentSubjectKey];
            let db = getScoresDB();

            return `
                <div class="space-y-6 animate-fade-in">
                    <!-- Navigation / Header -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                        <div class="flex items-center gap-4">
                            <button onclick="goHome()" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
                                ← Ana Sayfa
                            </button>
                            <div>
                                <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">Ders Üniteleri</span>
                                <h2 class="text-2xl font-extrabold text-slate-900">${subj.name} TYT Konu Listesi</h2>
                            </div>
                        </div>
                        <span class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-100 text-slate-700">
                            Toplam ${subj.topics.length} Ünite
                        </span>
                    </div>

                    <!-- Topic List Vertical -->
                    <div class="space-y-4">
                        ${subj.topics.map((topic, idx) => {
                            let record = db[topic.id];
                            let statusClass = "bg-white border-slate-200 hover:border-indigo-300 text-slate-800";
                            let statusBadge = `<span class="px-3 py-1 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">Çözülmedi</span>`;
                            let scoreText = "";

                            if (record) {
                                if (record.score >= 10) {
                                    statusClass = "bg-emerald-50/60 border-emerald-300 hover:border-emerald-400 text-emerald-900";
                                    statusBadge = `<span class="px-3 py-1 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">🟢 Başarılı (≥10)</span>`;
                                } else {
                                    statusClass = "bg-rose-50/60 border-rose-300 hover:border-rose-400 text-rose-900";
                                    statusBadge = `<span class="px-3 py-1 rounded-xl text-xs font-bold bg-rose-100 text-rose-800 border border-rose-200">🔴 Geliştirilmeli (<10)</span>`;
                                }
                                scoreText = `<span class="text-xs font-semibold opacity-80">En İyi Skor: ${record.score} / ${record.total}</span>`;
                            }

                            return `
                                <div class="p-6 rounded-2xl border ${statusClass} shadow-sm transition-all duration-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                    <div class="space-y-1">
                                        <div class="flex items-center gap-3">
                                            <span class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center text-xs font-bold">
                                                ${idx + 1}
                                            </span>
                                            <h4 class="text-lg font-bold">${topic.title}</h4>
                                        </div>
                                        <p class="text-xs opacity-75 pl-11 max-w-xl">${topic.desc}</p>
                                    </div>
                                    <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end pl-11 md:pl-0">
                                        <div class="text-right">
                                            ${statusBadge}

            let subj = subjectsData[currentSubjectKey];
            let topic = subj.topics.find(t => t.id === currentTopicId);

            let correct = 0;
            let wrong = 0;
            let empty = 0;

            topic.questions.forEach((q, idx) => {
                let ans = userAnswers[idx];
                if (ans !== undefined) {
                    if (ans === q.correct) correct++;
                    else wrong++;
                } else {
                    empty++;
                }
            });

            // Net Calculation (4 wrongs = 1 correct)
            let net = Math.max(0, correct - (wrong / 4)).toFixed(2);
            let percentage = Math.round((correct / topic.questions.length) * 100);

            // Save to LocalStorage
            saveScoreDB(topic.id, correct, topic.questions.length);

            lastQuizResult = {
                correct, wrong, empty, net, percentage, topic, seconds: quizSecondsElapsed
            };

            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });

                            </button>

                    </div>

                    <!-- Question-by-Question Review with Solutions -->
                    <div class="space-y-6">
